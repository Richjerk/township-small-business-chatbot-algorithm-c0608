# MCPize Configuration
# Docs: https://mcpize.com/docs/mcpize-yaml

version: 1

name: "Township Small Business Chatbot Algorithm"
slug: "township-small-business-chatbot-algorithm"

runtime: python
entry: "src/server.py"

build:
  install: "pip install --no-cache-dir -r requirements.txt"
  command: "pip install -r requirements.txt"

start:
  type: http
  command: "python src/server.py"

bridge:
  mode: http

credentials:
  - name: "OPENAI_API_KEY"
    description: "API key for accessing OpenAI models like gpt-3.5-turbo."
    docs_url: "https://platform.openai.com/api-keys"
  - name: "AUTH_GITHUB_ID"
    description: "GitHub OAuth client ID for NextAuth.js authentication."
    docs_url: "https://authjs.dev/reference/core/providers/github"
  - name: "AUTH_GITHUB_SECRET"
    description: "GitHub OAuth client secret for NextAuth.js authentication."
    docs_url: "https://authjs.dev/reference/core/providers/github"
